name: Build ISO

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Install ArchISO
        run: pacman -Syu --noconfirm archiso

      - name: Build the ISO
        run: |
          cd $GITHUB_WORKSPACE
          rm -rf ./out ./work
          mkarchiso -v -w ./work -o ./out .
       
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
	with:
	  name: katlinux-${{ github.sha }}
          path: out/*.iso
	  compression-level: 0
	  retention-days: 14
          
